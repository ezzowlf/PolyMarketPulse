[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarketpulse"
version = "0.1.0"
description = "Read-only Polymarket market scanner with SQLite history and Telegram alerts"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "truststore>=0.9,<1",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.5,<3",
  "openai>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
polymarketpulse = "polymarketpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The shared Windows temp dir (pytest-of-<user>) can be locked/permission-denied
# in sandboxed environments; keep pytest's tmp dirs inside the project instead.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)`; ruff's
# B008 (no function calls in defaults) is a false positive for this pattern.
"src/polymarketpulse/api.py" = ["B008"]
